name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # a test that hangs ends the job, not hours later
    timeout-minutes: 45
    env:
      # the tests never start Electron: no need for its 100 MB download
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      # the pnpm version package.json names (packageManager)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # apt on Ubuntu (Playwright's system packages): a mirror that stalls is left for the next one after 30 s, not 120,
      # and a download that fails is tried again
      - run: printf 'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci
        if: runner.os == 'Linux'
      # a slow apt mirror ends the job here, not at its limit with the tests unrun
      - run: pnpm --filter openfilm exec playwright-core install --with-deps chromium-headless-shell
        timeout-minutes: 15
      # ffmpeg on Linux: the static build the desktop app takes on a Mac (the Shaka project's, src/ffmpeg-runtime.mjs),
      # from GitHub in seconds, each program checked against its sha256. Ubuntu's package came through apt's mirror,
      # which at times took 20 to 40 minutes for its 99 packages
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          FFMPEG: https://github.com/shaka-project/static-ffmpeg-binaries/releases/download/n8.1.2-1
        run: |
          dir="$RUNNER_TEMP/ffmpeg"
          mkdir -p "$dir"
          for bin in ffmpeg ffprobe; do
            curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 -o "$dir/$bin" "$FFMPEG/$bin-linux-x64"
          done
          (cd "$dir" && sha256sum -c - <<'SUMS'
          9eac5b2b5076db5ff853a6fa0dcd6b8de7d0cac8481eadda6c47cd935825f1ee  ffmpeg
          065d3c56926052a76e884c4e4b51b7d95248da9391ab7effdcca6b94ceab98cf  ffprobe
          SUMS
          )
          chmod +x "$dir/ffmpeg" "$dir/ffprobe"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/ffmpeg" -hide_banner -version | head -n 1
          # what the tests use
          "$dir/ffmpeg" -hide_banner -encoders | grep -E ' (libx264|libx265|libvpx-vp9|prores_ks|aac|libopus|libmp3lame) '
          for enc in libx264 libx265 libvpx-vp9 prores_ks aac libopus libmp3lame; do
            "$dir/ffmpeg" -hide_banner -encoders | grep -q " $enc " || { echo "::error::ffmpeg has no $enc"; exit 1; }
          done
          "$dir/ffmpeg" -hide_banner -v error -f lavfi -i testsrc2=size=64x64:rate=30 -f lavfi -i sine -t 0.2 -c:v libx264 -c:a aac -f null -
      - run: brew install ffmpeg
        if: runner.os == 'macOS'
      # Chocolatey reports success when its feed times out and nothing is installed: tried three times, then the step
      # fails if there is still no ffmpeg, instead of every test that needs it failing later
      - run: |
          for ($i = 1; $i -le 3 -and -not (Get-Command ffmpeg -ErrorAction SilentlyContinue); $i++) {
            choco install ffmpeg --no-progress -y
            if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { Start-Sleep -Seconds (20 * $i) }
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { Write-Error 'ffmpeg did not install'; exit 1 }
          ffmpeg -version | Select-Object -First 1
        shell: pwsh
        if: runner.os == 'Windows'
      - run: pnpm test
        env:
          # what a failing test keeps to be looked at (look's two pictures of a t that differed)
          OPENFILM_TEST_ARTIFACTS: ${{ runner.temp }}/test-artifacts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-artifacts-${{ matrix.os }}
          path: ${{ runner.temp }}/test-artifacts
          if-no-files-found: ignore
          retention-days: 14

  # what npm would get: the tarball of openfilm, listed in the log and checked (no tests, fixtures or dev files; the
  # official product.json)
  pack:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:pack

  audit:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          # every commit, for the secret scan of the history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Secrets in the history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
      - name: The public audit (the files as they are)
        run: node scripts/audit-public.mjs
